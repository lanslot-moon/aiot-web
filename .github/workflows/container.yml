name: Build frontend image
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  packages: write
concurrency:
  group: frontend-image-${{ github.ref }}
  cancel-in-progress: false
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/lanslot-moon/aiot-web:latest
            ghcr.io/lanslot-moon/aiot-web:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/lanslot-moon/aiot-web
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Image summary
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          COMMIT: ${{ github.sha }}
        run: |
          echo "Image: ghcr.io/lanslot-moon/aiot-web:sha-${COMMIT}" >> "$GITHUB_STEP_SUMMARY"
          echo "Digest: ${DIGEST}" >> "$GITHUB_STEP_SUMMARY"
